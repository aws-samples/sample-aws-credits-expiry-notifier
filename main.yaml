AWSTemplateFormatVersion: '2010-09-09'

Description: >
  AWS Credits Notifier - Solution 3 (single self-contained file). Notifies when a
  new AWS credit is assigned and when a credit approaches expiry. Upload this ONE
  template in the CloudFormation console and deploy - no S3 bucket, no zip to
  stage, no Lambda layer, no CLI. The handler source travels inside the template
  and is installed by a custom resource. Pure CloudFormation - no transforms.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: 1. Notification delivery}
        Parameters: [NotificationEmails, ExistingSnsTopicArn, SnsKmsKeyArn]
      - Label: {default: 2. Accounts to monitor}
        Parameters: [TargetPayerAccounts, AssumeRoleName, ExternalId]
      - Label: {default: 3. Alerting behaviour}
        Parameters:
          - ExpiryThresholdDays
          - MinRemainingForExpiryAlert
          - ScheduleExpression
          - ScheduleState
      - Label: {default: 4. Runtime and retention}
        Parameters: [LambdaRuntime, FunctionTimeout, StateRetentionDays, LogRetentionDays]
    ParameterLabels:
      NotificationEmails: {default: Notification email addresses (comma separated)}
      TargetPayerAccounts: {default: Extra payer accounts to monitor (optional)}
      ExistingSnsTopicArn: {default: Reuse an existing SNS topic (optional)}
      SnsKmsKeyArn: {default: Customer managed KMS key for SNS (optional)}

Parameters:

  # ---- 1. notification delivery

  NotificationEmails:
    Type: String
    Default: ''
    # {0,9} caps the list at 10 so an 11th address fails validation loudly
    # rather than being silently dropped by the fixed-index subscriptions.
    AllowedPattern: '^$|^[^@\s,]+@[^@\s,]+\.[^@\s,]+(,[^@\s,]+@[^@\s,]+\.[^@\s,]+){0,9}$'
    ConstraintDescription: >
      Up to 10 comma-separated email addresses with NO SPACES, e.g.
      finops@example.com,cloudops@example.com
    Description: >
      Email addresses to notify, comma separated, NO SPACES. Up to 10 supported.
      Each address receives an SNS confirmation email that MUST be clicked before
      alerts are delivered. Leave blank only if reusing an existing topic that
      already has subscribers.

  ExistingSnsTopicArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:sns:[a-z0-9-]+:[0-9]{12}:.+$'
    Description: >
      OPTIONAL. ARN of an existing SNS topic to publish into, for example one
      already wired to a ticketing system or chat channel. Leave blank to create
      a new topic. Must be in this account and region.

  SnsKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$'
    Description: >
      OPTIONAL. Customer managed KMS key ARN for encrypting the new SNS topic.
      Leave blank to use the AWS managed key alias/aws/sns.

  # ---- 2. accounts to monitor

  TargetPayerAccounts:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]{12}(,[0-9]{12})*$'
    ConstraintDescription: >
      Comma-separated 12-digit account IDs with no spaces, e.g.
      222233334444,333344445555
    Description: >
      OPTIONAL. Leave BLANK to monitor only this account, which needs no extra
      setup. If you set it, it REPLACES the list rather than adding to it - so
      list EVERY payer account you want monitored, INCLUDING this one, or this
      account stops being monitored. Each OTHER account also needs
      other-payers.yaml deployed in it first.
      Example: 111122223333,222233334444,333344445555

  AssumeRoleName:
    Type: String
    Default: AWSCreditsNotifierReadRole
    AllowedPattern: '^[\w+=,.@-]{1,64}$'
    Description: >
      Only used when TargetPayerAccounts is set. Name of the read-only role to
      assume in each OTHER payer account. This account is always read directly.

  ExternalId:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      OPTIONAL shared secret, only used when TargetPayerAccounts is set. When
      set, each spoke role accepts the AssumeRole call ONLY if it also presents
      this exact string. It guards against a third party tricking a shared hub
      into reading an account it should not - not a risk when you own every
      account. RECOMMENDED: leave blank. If set, the identical value must be set
      in EVERY spoke stack, and NoEcho means you cannot read it back later.

  # ---- 3. alerting behaviour

  ExpiryThresholdDays:
    Type: String
    Default: '90,60,30,7'
    AllowedPattern: '^[0-9]+(,[0-9]+)*$'
    ConstraintDescription: Comma-separated whole numbers with no spaces, e.g. 90,60,30,7
    Description: >
      Days-before-expiry at which to alert, comma separated. Each threshold
      fires at most once per credit.

  MinRemainingForExpiryAlert:
    Type: String
    Default: '0'
    AllowedPattern: '^[0-9]+(\.[0-9]{1,2})?$'
    Description: >
      Suppress expiry alerts when the remaining balance is below this amount.
      Leave at 0 to be told about every expiring credit. New-credit alerts are
      never suppressed by this.

  ScheduleExpression:
    Type: String
    Default: 'cron(0 13 * * ? *)'
    Description: >
      When to check for changes. Default 13:00 UTC daily. Estimated credit
      balances refresh every 24 hours, so daily is the useful maximum.

  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Set to DISABLED to deploy without starting the daily checks, then enable
      once you have confirmed a manual invoke works.

  # ---- 4. runtime and retention

  LambdaRuntime:
    Type: String
    Default: python3.13
    AllowedValues: [python3.12, python3.13]
    Description: Python runtime for both functions.

  FunctionTimeout:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 900
    Description: >
      Seconds. Accounts are walked sequentially, so raise this if you list many
      in TargetPayerAccounts.

  StateRetentionDays:
    Type: Number
    Default: 400
    MinValue: 30
    MaxValue: 3650
    Description: Days to retain per-credit state after a credit expires.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch Logs retention.

Conditions:

  CreateTopic: !Equals [!Ref ExistingSnsTopicArn, '']
  HasCustomKmsKey: !Not [!Equals [!Ref SnsKmsKeyArn, '']]
  HasTargetAccounts: !Not [!Equals [!Ref TargetPayerAccounts, '']]

  # CloudFormation cannot loop, so a comma-separated list is read by fixed index.
  # Padding the split with empty strings keeps every !Select in range regardless
  # of how many addresses were supplied.
  HasEmail1: !Not [!Equals [!Select [0, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']], '']]
  HasEmail2: !Not [!Equals [!Select [1, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']], '']]
  HasEmail3: !Not [!Equals [!Select [2, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']], '']]
  HasEmail4: !Not [!Equals [!Select [3, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']], '']]
  HasEmail5: !Not [!Equals [!Select [4, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']], '']]
  HasEmail6: !Not [!Equals [!Select [5, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']], '']]
  HasEmail7: !Not [!Equals [!Select [6, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']], '']]
  HasEmail8: !Not [!Equals [!Select [7, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']], '']]
  HasEmail9: !Not [!Equals [!Select [8, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']], '']]
  HasEmail10: !Not [!Equals [!Select [9, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']], '']]

Resources:

  # ---------------------------------------------------------- encryption key
  # One customer-managed key encrypts the state table, the dead-letter queue,
  # and (by default) the alert topic. Grants are split per service because each
  # calls KMS differently: DynamoDB and the two queues/topics act on the
  # function's behalf (kms:ViaService), while CloudWatch alarms call KMS with
  # their own service principal and must NOT carry a ViaService condition, or
  # the alarm silently fails to publish.

  CreditsKey:
    Type: AWS::KMS::Key
    # A KMS key cannot be hard-deleted; it enters a pending-deletion window.
    # Retain makes that explicit rather than pretending the stack removes it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'Encrypts credits-notifier state, DLQ and alerts for ${AWS::StackName}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Anti-lockout: the account keeps key administration. This is the
          # account root, not a wildcard principal, so it does not trip the
          # wildcard-principal rule.
          - Sid: EnableRootAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          # Principals in this account may use the key, but only when the call
          # comes through DynamoDB, SNS or SQS (kms:ViaService). The notifier
          # role's own IAM policy scopes WHICH principal; naming it here too
          # would create a key -> role -> topic -> key dependency cycle, so the
          # grant is account-scoped and the role policy does the narrowing.
          # CreateGrant is included because DynamoDB requires it.
          - Sid: AllowUseViaAwsServices
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
              - 'kms:CreateGrant'
            Resource: '*'
            Condition:
              StringLike:
                'kms:ViaService':
                  - 'dynamodb.*.amazonaws.com'
                  - !Sub 'sns.${AWS::Region}.amazonaws.com'
                  - !Sub 'sqs.${AWS::Region}.amazonaws.com'
          # SNS encrypting topic messages on its own behalf.
          - Sid: AllowSnsService
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
          # CloudWatch alarms publishing to the encrypted topic. They call KMS
          # with their own principal, so NO kms:ViaService here.
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'

  CreditsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-credits'
      TargetKeyId: !Ref CreditsKey

  # ------------------------------------------------------------------- state

  CreditStateTable:
    Type: AWS::DynamoDB::Table
    # Derived state, rebuildable. If the table is recreated the handler
    # re-baselines each account with one inventory email, not an alert storm.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${AWS::StackName}-credit-state'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        # Composite value "accountId#creditId" - see _state_key in the handler.
        - {AttributeName: creditKey, AttributeType: S}
      KeySchema:
        - {AttributeName: creditKey, KeyType: HASH}
      TimeToLiveSpecification:
        AttributeName: expireAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CreditsKey
      Tags:
        - {Key: Application, Value: aws-credits-notifier}

  # ------------------------------------------------------------ notification

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: CreateTopic
    Properties:
      TopicName: !Sub '${AWS::StackName}-credit-alerts'
      DisplayName: AWS Credit Alerts
      KmsMasterKeyId: !If [HasCustomKmsKey, !Ref SnsKmsKeyArn, !Ref CreditsKey]
      Tags:
        - {Key: Application, Value: aws-credits-notifier}

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateTopic
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarmsToPublish
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: 'sns:Publish'
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                'AWS:SourceAccount': !Ref 'AWS::AccountId'
          - Sid: DenyNonTlsRequests
            Effect: Deny
            Principal: '*'
            Action: 'sns:Publish'
            Resource: !Ref AlertTopic
            Condition:
              Bool: {'aws:SecureTransport': false}

  EmailSubscription1:
    Type: AWS::SNS::Subscription
    Condition: HasEmail1
    Properties:
      TopicArn: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
      Protocol: email
      Endpoint: !Select [0, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']]

  EmailSubscription2:
    Type: AWS::SNS::Subscription
    Condition: HasEmail2
    Properties:
      TopicArn: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
      Protocol: email
      Endpoint: !Select [1, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']]

  EmailSubscription3:
    Type: AWS::SNS::Subscription
    Condition: HasEmail3
    Properties:
      TopicArn: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
      Protocol: email
      Endpoint: !Select [2, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']]

  EmailSubscription4:
    Type: AWS::SNS::Subscription
    Condition: HasEmail4
    Properties:
      TopicArn: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
      Protocol: email
      Endpoint: !Select [3, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']]

  EmailSubscription5:
    Type: AWS::SNS::Subscription
    Condition: HasEmail5
    Properties:
      TopicArn: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
      Protocol: email
      Endpoint: !Select [4, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']]

  EmailSubscription6:
    Type: AWS::SNS::Subscription
    Condition: HasEmail6
    Properties:
      TopicArn: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
      Protocol: email
      Endpoint: !Select [5, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']]

  EmailSubscription7:
    Type: AWS::SNS::Subscription
    Condition: HasEmail7
    Properties:
      TopicArn: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
      Protocol: email
      Endpoint: !Select [6, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']]

  EmailSubscription8:
    Type: AWS::SNS::Subscription
    Condition: HasEmail8
    Properties:
      TopicArn: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
      Protocol: email
      Endpoint: !Select [7, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']]

  EmailSubscription9:
    Type: AWS::SNS::Subscription
    Condition: HasEmail9
    Properties:
      TopicArn: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
      Protocol: email
      Endpoint: !Select [8, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']]

  EmailSubscription10:
    Type: AWS::SNS::Subscription
    Condition: HasEmail10
    Properties:
      TopicArn: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
      Protocol: email
      Endpoint: !Select [9, !Split [',', !Sub '${NotificationEmails},,,,,,,,,']]

  # ----------------------------------------------------------------- compute

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    # Transient failure envelopes only.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${AWS::StackName}-dlq'
      MessageRetentionPeriod: 1209600  # 14 days
      KmsMasterKeyId: !Ref CreditsKey
      KmsDataKeyReusePeriodSeconds: 300

  NotifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-notifier-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: credits-notifier
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # billing:GetCredits does not support resource-level permissions,
              # so Resource must be "*". It is a read-only billing action.
              - Sid: ReadCredits
                Effect: Allow
                Action: 'billing:GetCredits'
                Resource: '*'
              - Sid: WhoAmI
                Effect: Allow
                Action: 'sts:GetCallerIdentity'
                Resource: '*'
              - !If
                - HasTargetAccounts
                - Sid: AssumeSpokeRoles
                  Effect: Allow
                  Action: 'sts:AssumeRole'
                  Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/${AssumeRoleName}'
                - !Ref 'AWS::NoValue'
              - Sid: CreditStateAccess
                Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:PutItem'
                Resource: !GetAtt CreditStateTable.Arn
              - Sid: PublishAlerts
                Effect: Allow
                Action: 'sns:Publish'
                Resource: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
              # DynamoDB uses the key on the function's behalf, and needs the
              # full action set plus CreateGrant. The region is wildcarded
              # because DynamoDB may call KMS region-independently.
              - Sid: UseKeyForDynamoDb
                Effect: Allow
                Action:
                  - 'kms:Encrypt'
                  - 'kms:Decrypt'
                  - 'kms:ReEncrypt*'
                  - 'kms:GenerateDataKey*'
                  - 'kms:DescribeKey'
                  - 'kms:CreateGrant'
                Resource: !GetAtt CreditsKey.Arn
                Condition:
                  StringLike:
                    'kms:ViaService': 'dynamodb.*.amazonaws.com'
              # Publishing to the encrypted topic and writing to the encrypted
              # DLQ. Scoped by kms:ViaService so the grant only works through
              # SNS and SQS. A customer override key for SNS is also allowed.
              - Sid: UseKeyForSnsAndSqs
                Effect: Allow
                Action:
                  - 'kms:GenerateDataKey*'
                  - 'kms:Decrypt'
                Resource: !If [HasCustomKmsKey, [!GetAtt CreditsKey.Arn, !Ref SnsKmsKeyArn], !GetAtt CreditsKey.Arn]
                Condition:
                  StringEquals:
                    'kms:ViaService':
                      - !Sub 'sns.${AWS::Region}.amazonaws.com'
                      - !Sub 'sqs.${AWS::Region}.amazonaws.com'
              - Sid: SendToDlq
                Effect: Allow
                Action: 'sqs:SendMessage'
                Resource: !GetAtt DeadLetterQueue.Arn

  # Created explicitly so RetentionInDays applies from the first invocation.
  NotifierLogGroup:
    Type: AWS::Logs::LogGroup
    # Logs follow the stack lifecycle.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-notifier'
      RetentionInDays: !Ref LogRetentionDays

  # The real handler is ~22 KB, far beyond the 4096-byte Code.ZipFile limit, so
  # the function is created with a placeholder and InstallCode below replaces the
  # code with the version carried in HandlerSourceGz. If you ever see the
  # placeholder error at runtime, the custom resource did not complete.
  NotifierFunction:
    Type: AWS::Lambda::Function
    DependsOn: [NotifierLogGroup, RolePropagation]
    Properties:
      FunctionName: !Sub '${AWS::StackName}-notifier'
      Description: Detects new and expiring AWS credits and publishes to SNS
      Runtime: !Ref LambdaRuntime
      Handler: credit_notifier.handler
      Role: !GetAtt NotifierRole.Arn
      Architectures: [arm64]
      MemorySize: 256
      Timeout: !Ref FunctionTimeout
      ReservedConcurrentExecutions: 1
      Code:
        ZipFile: |
          def handler(event, context):
              raise RuntimeError(
                  "Placeholder code still in place. The InstallCode custom "
                  "resource should have replaced this with credit_notifier.py. "
                  "Check the stack events and the code-installer log group."
              )
      DeadLetterConfig:
        TargetArn: !GetAtt DeadLetterQueue.Arn
      Environment:
        Variables:
          STATE_TABLE: !Ref CreditStateTable
          SNS_TOPIC_ARN: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
          EXPIRY_THRESHOLDS: !Ref ExpiryThresholdDays
          MIN_REMAINING_ALERT: !Ref MinRemainingForExpiryAlert
          STATE_TTL_DAYS: !Ref StateRetentionDays
          # Billing is a global service homed in us-east-1. Kept separate
          # from the stack's own region so this can deploy anywhere.
          BILLING_REGION: us-east-1
          TARGET_ACCOUNTS: !Ref TargetPayerAccounts
          ASSUME_ROLE_NAME: !If [HasTargetAccounts, !Ref AssumeRoleName, '']
          EXTERNAL_ID: !Ref ExternalId
      Tags:
        - {Key: Application, Value: aws-credits-notifier}

  # ------------------------------------------------- IAM propagation barrier
  # Both execution roles are created in this stack and consumed immediately by
  # CreateFunction. IAM is eventually consistent, so a fresh role's trust policy
  # may not yet be visible to the endpoint that validates sts:AssumeRole, and
  # CreateFunction then fails with "the role cannot be assumed by Lambda". A
  # large inline policy widens that window - which is why adding KMS statements
  # tipped a previously reliable deploy into failing. This resource polls until
  # each role is assumable, then signals CloudFormation, so the functions below
  # start only once IAM has settled. DependsOn cannot do this - it orders
  # creation but does not wait for propagation.
  RolePropagationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-role-propagation-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: probe-target-roles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Only NotifierRole needs probing - it carries the large KMS inline
              # policy that widens the propagation window. CodeInstallerRole is
              # tiny and settles within IAM's normal grace period. Probing it too
              # would form a cycle, because CodeInstallerRole references
              # NotifierFunction, which waits on this barrier.
              - Sid: AssumeTargetRole
                Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: !GetAtt NotifierRole.Arn

  RolePropagationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-role-propagation'
      RetentionInDays: !Ref LogRetentionDays

  RolePropagationFunction:
    Type: AWS::Lambda::Function
    DependsOn: RolePropagationLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-role-propagation'
      Description: Waits until freshly created execution roles are assumable
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt RolePropagationRole.Arn
      MemorySize: 128
      Timeout: 300
      Code:
        ZipFile: |
          import json, time, urllib.request, boto3
          from botocore.exceptions import ClientError


          def respond(event, context, status, message=""):
              body = json.dumps({
                  "Status": status,
                  "Reason": (message or "see CloudWatch logs")[:900],
                  "PhysicalResourceId": event.get("PhysicalResourceId") or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": {},
              }).encode()
              urllib.request.urlopen(urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))}))


          def handler(event, context):
              try:
                  if event["RequestType"] != "Delete":
                      sts = boto3.client("sts")
                      roles = event["ResourceProperties"].get("RoleArns", [])
                      # Leave headroom before the 300s timeout so we always signal.
                      deadline = time.time() + 240
                      for arn in roles:
                          while True:
                              try:
                                  sts.assume_role(RoleArn=arn, RoleSessionName="propcheck")
                                  print("assumable:", arn)
                                  break
                              except ClientError as e:
                                  code = e.response["Error"]["Code"]
                                  # AccessDenied means the trust policy WAS evaluated,
                                  # so it has propagated - good enough to proceed.
                                  if code == "AccessDenied":
                                      print("trust visible (AccessDenied):", arn)
                                      break
                                  if time.time() > deadline:
                                      raise TimeoutError("role not assumable in time: " + arn)
                                  time.sleep(3)
                  respond(event, context, "SUCCESS")
              except Exception as exc:
                  print("ERROR", repr(exc))
                  respond(event, context, "FAILED", str(exc))

  RolePropagation:
    Type: Custom::RolePropagation
    Properties:
      ServiceToken: !GetAtt RolePropagationFunction.Arn
      # Bump to force a re-run if the polling logic above changes.
      Version: 1
      RoleArns:
        - !GetAtt NotifierRole.Arn

  # ------------------------------------------------------- code installation

  CodeInstallerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-code-installer-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: install-notifier-code
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to the one function this stack owns.
              - Sid: ReplaceNotifierCode
                Effect: Allow
                Action:
                  - 'lambda:UpdateFunctionCode'
                  - 'lambda:GetFunction'
                  - 'lambda:GetFunctionConfiguration'
                Resource: !GetAtt NotifierFunction.Arn

  CodeInstallerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-code-installer'
      RetentionInDays: !Ref LogRetentionDays

  # Small enough to sit inline. Decodes HandlerSourceGz, zips it, and replaces
  # the notifier's placeholder code. Always answers CloudFormation, including on
  # failure, so a mistake here surfaces as a stack error instead of a one-hour
  # hang waiting for a response that never arrives.
  CodeInstallerFunction:
    Type: AWS::Lambda::Function
    DependsOn: [CodeInstallerLogGroup, RolePropagation]
    Properties:
      FunctionName: !Sub '${AWS::StackName}-code-installer'
      Description: Installs the credits-notifier handler carried in this template
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt CodeInstallerRole.Arn
      MemorySize: 256
      Timeout: 300
      Code:
        ZipFile: |
          import base64, gzip, io, json, urllib.request, zipfile, boto3


          def respond(event, context, status, message=""):
              body = json.dumps({
                  "Status": status,
                  "Reason": (message or "see CloudWatch logs")[:900],
                  "PhysicalResourceId": event.get("PhysicalResourceId") or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": {},
              }).encode()
              urllib.request.urlopen(urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))}))


          def handler(event, context):
              try:
                  if event["RequestType"] != "Delete":
                      props = event["ResourceProperties"]
                      name = props["FunctionName"]
                      source = gzip.decompress(base64.b64decode("".join(props["SourceGz"].split())))
                      buf = io.BytesIO()
                      with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as z:
                          info = zipfile.ZipInfo(props.get("FileName", "credit_notifier.py"))
                          info.external_attr = 0o644 << 16
                          # A ZipInfo carries its own compress_type, defaulting to
                          # ZIP_STORED, which silently overrides the ZipFile setting.
                          info.compress_type = zipfile.ZIP_DEFLATED
                          z.writestr(info, source)
                      client = boto3.client("lambda")
                      client.update_function_code(FunctionName=name, ZipFile=buf.getvalue())
                      client.get_waiter("function_updated_v2").wait(FunctionName=name)
                      print("installed %d bytes into %s" % (len(source), name))
                  respond(event, context, "SUCCESS")
              except Exception as exc:
                  print("ERROR", repr(exc))
                  respond(event, context, "FAILED", str(exc))

  # Runtime is passed as a property on purpose: if the runtime changes,
  # CloudFormation updates NotifierFunction (resetting it to the placeholder),
  # and this property change forces the installer to run again afterwards.
  #
  # InstallerVersion exists because a custom resource only re-runs when one of
  # ITS OWN properties changes. Editing CodeInstallerFunction's code does not
  # change this resource's properties or its ServiceToken ARN, so without a
  # version to bump, an installer fix would silently reach new deployments only.
  # Bump it whenever the installer logic changes.
  InstallCode:
    Type: Custom::NotifierCode
    Properties:
      ServiceToken: !GetAtt CodeInstallerFunction.Arn
      FunctionName: !Ref NotifierFunction
      FileName: credit_notifier.py
      Runtime: !Ref LambdaRuntime
      InstallerVersion: 2
      # gzip + base64 of src/credit_notifier.py. Regenerate with ./src/build.py
      # after editing the handler; --check verifies this is current. Decode
      # and audit it with the command in this folder's README - it decompresses
      # byte-for-byte back to src/credit_notifier.py.
