  # -------------------------------------------------------------- scheduling

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: invoke-notifier
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'lambda:InvokeFunction'
                Resource: !GetAtt NotifierFunction.Arn

  # DependsOn InstallCode so the schedule cannot fire the placeholder code.
  DailySchedule:
    Type: AWS::Scheduler::Schedule
    DependsOn: InstallCode
    Properties:
      Name: !Sub '${AWS::StackName}-daily'
      Description: Daily AWS credit check
      State: !Ref ScheduleState
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !GetAtt NotifierFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

  # -------------------------------------------------------------- monitoring
  # Without these a broken notifier looks exactly like "no credit changes" -
  # the failure mode of any notification system is silence.

  FunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-notifier-errors'
      AlarmDescription: The credits notifier errored. Credit alerts may be missing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref NotifierFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]]

  FunctionNotRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-notifier-not-running'
      AlarmDescription: >
        The credits notifier has not run in 48 hours. The schedule may be
        disabled or deleted - alerts would stop silently.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - {Name: FunctionName, Value: !Ref NotifierFunction}
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]]

Outputs:

  AlertTopicArn:
    Description: SNS topic carrying credit alerts. Subscribe extra recipients here.
    Value: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
    Export:
      Name: !Sub '${AWS::StackName}-AlertTopicArn'

  FunctionName:
    Description: Lambda function name.
    Value: !Ref NotifierFunction
  NotifierRoleName:
    Description: >
      The notifier Lambda execution role name. When monitoring other payer
      accounts, use this exact value as the HubRoleNamePattern parameter of
      other-payers.yaml in each spoke account, so each spoke trusts only this
      role.
    Value: !Ref NotifierRole

  StateTableName:
    Description: >
      DynamoDB table of per-credit state, keyed accountId#creditId. Delete an
      item to make the notifier treat that credit as new again.
    Value: !Ref CreditStateTable

  DeadLetterQueueUrl:
    Description: Failed invocations land here, retained 14 days.
    Value: !Ref DeadLetterQueue

  MonitoredAccounts:
    Description: Accounts scanned. "this account only" when TargetPayerAccounts is blank.
    Value: !If [HasTargetAccounts, !Ref TargetPayerAccounts, 'this account only']

  ManualTestCommand:
    Description: Run the notifier now instead of waiting for the schedule.
    Value: !Sub 'aws lambda invoke --function-name ${NotifierFunction} --region ${AWS::Region} /dev/stdout'

  AddRecipientCommand:
    Description: Subscribe an additional email address after deployment.
    Value: !Sub
      - 'aws sns subscribe --topic-arn ${Topic} --protocol email --notification-endpoint NEW@example.com'
      - Topic: !If [CreateTopic, !Ref AlertTopic, !Ref ExistingSnsTopicArn]
